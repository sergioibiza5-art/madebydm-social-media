name: Import detailing support media

on:
  push:
    paths:
      - '.staging/detailing-support-01.part1'
      - '.staging/detailing-support-01.part2'
      - '.staging/detailing-support-01.part3'
      - '.github/workflows/import-detailing-support-image.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct staged JPEG
        run: |
          mkdir -p media/detailing-support-2026-08
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts = [Path(f'.staging/detailing-support-01.part{i}').read_text().strip() for i in (1,2,3)]
          encoded = ''.join(parts)
          print('part_lengths=', [len(p) for p in parts], 'total=', len(encoded), 'modulo4=', len(encoded) % 4)
          data = base64.b64decode(encoded, validate=True)
          out = Path('media/detailing-support-2026-08/01-loaded.jpg')
          out.write_bytes(data)
          print('decoded_bytes=', len(data), 'jpeg_header=', data[:2].hex(), 'jpeg_tail=', data[-2:].hex(), 'sha256=', hashlib.sha256(data).hexdigest())
          if data[:2] != b'\xff\xd8' or data[-2:] != b'\xff\xd9':
              raise SystemExit('Decoded payload is not a complete JPEG')
          PY
          file media/detailing-support-2026-08/01-loaded.jpg

      - name: Save imported media
        run: |
          git config user.name "sergioibiza5-art"
          git config user.email "sergioibiza5-art@users.noreply.github.com"
          git add media/detailing-support-2026-08/01-loaded.jpg
          if git diff --cached --quiet; then
            echo "No media changes"
            exit 0
          fi
          git commit -m "media: add detailing support hero image"
          git push
