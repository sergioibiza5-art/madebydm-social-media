name: Re-encode Instagram carousel JPEGs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/reencode-instagram-jpegs.py'
      - '.github/workflows/reencode-instagram-jpegs.yml'

permissions:
  contents: write

jobs:
  reencode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Re-encode JPEGs
        run: python scripts/reencode-instagram-jpegs.py

      - name: Commit corrected media
        run: |
          git config user.name "sergioibiza5-art"
          git config user.email "sergioibiza5-art@users.noreply.github.com"
          git add media/pokemon-chess-2026-08/*.jpg diagnostics/instagram-jpeg-reencode.json
          if git diff --cached --quiet; then
            echo "No media changes"
            exit 0
          fi
          git commit -m "fix: reencode Pokemon chess carousel for Instagram"
          git push
