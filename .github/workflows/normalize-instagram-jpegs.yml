name: Normalize Instagram JPEGs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/normalize-instagram-jpegs.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Recover and convert carousel images to baseline RGB JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageFile

          folder = Path('media/pokemon-chess-2026-08')
          files = sorted(folder.glob('*.jpg'))
          if len(files) != 5:
              raise SystemExit(f'Expected 5 JPEGs, found {len(files)}')

          def sof_marker(data: bytes):
              i = 2
              while i + 3 < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  if i >= len(data):
                      break
                  marker = data[i]
                  i += 1
                  if marker in (0xD8, 0xD9) or 0xD0 <= marker <= 0xD7:
                      continue
                  if marker == 0xDA:
                      break
                  if i + 1 >= len(data):
                      break
                  length = (data[i] << 8) + data[i + 1]
                  if marker in (0xC0, 0xC1, 0xC2, 0xC3, 0xC5, 0xC6, 0xC7, 0xC9, 0xCA, 0xCB, 0xCD, 0xCE, 0xCF):
                      return marker
                  i += length
              return None

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          recovered = []
          for path in files:
              before = path.read_bytes()
              before_marker = sof_marker(before)
              with Image.open(path) as source:
                  source.load()
                  im = ImageOps.exif_transpose(source).convert('RGB')
                  if im.size != (1080, 1350):
                      raise SystemExit(f'{path}: unexpected dimensions {im.size}; refusing to resize')
                  recovered.append((path, im.copy(), before_marker, len(before)))

          for path, im, before_marker, before_size in recovered:
              im.save(
                  path,
                  format='JPEG',
                  quality=95,
                  optimize=True,
                  progressive=False,
                  subsampling=0,
              )

              after = path.read_bytes()
              after_marker = sof_marker(after)
              if after_marker != 0xC0:
                  raise SystemExit(f'{path}: expected baseline SOF0 (0xC0), got {after_marker!r}')

              ImageFile.LOAD_TRUNCATED_IMAGES = False
              with Image.open(path) as verify:
                  verify.load()
                  if verify.mode != 'RGB' or verify.size != (1080, 1350):
                      raise SystemExit(f'{path}: verification failed mode={verify.mode} size={verify.size}')
              ImageFile.LOAD_TRUNCATED_IMAGES = True

              print(
                  f'{path}: recovered OK | 1080x1350 RGB | '
                  f'SOF 0x{before_marker:02X}->0x{after_marker:02X} | '
                  f'bytes {before_size}->{len(after)}'
              )
          PY

      - name: Commit normalized JPEGs
        run: |
          git config user.name "sergioibiza5-art"
          git config user.email "282808339+sergioibiza5-art@users.noreply.github.com"
          git add media/pokemon-chess-2026-08/*.jpg
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "fix: recover Instagram carousel JPEGs as baseline"
          git push
