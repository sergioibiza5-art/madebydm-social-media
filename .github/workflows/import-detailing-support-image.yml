name: Import detailing support media

on:
  push:
    paths:
      - '.staging/detailing-support-01.b64'
      - '.github/workflows/import-detailing-support-image.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode staged JPEG
        run: |
          mkdir -p media/detailing-support-2026-08
          python - <<'PY'
          from pathlib import Path
          import base64, re
          src = Path('.staging/detailing-support-01.b64').read_text()
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', src)
          print(f'staged_chars={len(src)} clean_base64_chars={len(clean)} modulo4={len(clean)%4}')
          clean += '=' * ((4 - len(clean) % 4) % 4)
          data = base64.b64decode(clean, validate=False)
          out = Path('media/detailing-support-2026-08/01-loaded.jpg')
          out.write_bytes(data)
          print(f'decoded_bytes={len(data)} jpeg_header={data[:2].hex()} jpeg_tail={data[-2:].hex()}')
          if data[:2] != b'\xff\xd8' or data[-2:] != b'\xff\xd9':
              raise SystemExit('Decoded payload is not a complete JPEG')
          PY
          file media/detailing-support-2026-08/01-loaded.jpg

      - name: Save imported media
        run: |
          git config user.name "sergioibiza5-art"
          git config user.email "sergioibiza5-art@users.noreply.github.com"
          git add media/detailing-support-2026-08/01-loaded.jpg
          if git diff --cached --quiet; then
            echo "No media changes"
            exit 0
          fi
          git commit -m "media: add detailing support hero image"
          git push
